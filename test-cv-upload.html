<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Upload Test - Recruily</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .upload-area.dragover {
            border-color: #667eea;
            background: #f0f7ff;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn:hover {
            background: #5a67d8;
        }
        
        .btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 2rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none;
        }
        
        .result.success {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            color: #22543d;
        }
        
        .result.error {
            background: #fed7d7;
            border: 1px solid #fc8181;
            color: #742a2a;
        }
        
        .progress {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin: 1rem 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #667eea;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .file-info {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 1rem;
            margin: 1rem 0;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
        }
        
        .workflow-steps {
            display: grid;
            gap: 0.5rem;
            margin: 1rem 0;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.9rem;
        }
        
        .step {
            padding: 0.5rem;
            border-radius: 4px;
            background: #f7fafc;
        }
        
        .step.completed {
            background: #f0fff4;
            color: #22543d;
        }
        
        .step.failed {
            background: #fed7d7;
            color: #742a2a;
        }
        
        .candidate-details {
            background: #f7fafc;
            border-radius: 6px;
            padding: 1rem;
            margin: 1rem 0;
        }
        
        .candidate-details h3 {
            margin: 0 0 0.5rem 0;
            color: #2d3748;
        }
        
        .candidate-details p {
            margin: 0.25rem 0;
            color: #4a5568;
        }
        
        .instructions {
            background: #edf2f7;
            border-radius: 6px;
            padding: 1rem;
            margin-top: 2rem;
        }
        
        .instructions h3 {
            margin: 0 0 0.5rem 0;
            color: #2d3748;
        }
        
        .instructions ul {
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }
        
        .instructions li {
            margin: 0.25rem 0;
            color: #4a5568;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            📄 CV Upload Test
        </h1>
        <div class="subtitle">
            Test the enhanced Gemini AI CV parsing system - now extracts real data instead of generic placeholders!
        </div>
        
        <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3rem; margin-bottom: 1rem;">📤</div>
            <div style="font-size: 1.2rem; margin-bottom: 0.5rem;">Drop your CV here or click to upload</div>
            <div style="color: #666;">Supports PDF, DOC, DOCX, TXT files</div>
            <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt" onchange="handleFileSelect(event)">
        </div>
        
        <button class="btn" id="uploadBtn" onclick="uploadFile()" disabled>
            🚀 Process CV with Gemini AI
        </button>
        
        <div class="progress" id="progressContainer" style="display: none;">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div id="result" class="result"></div>
    </div>
    
    <script>
        let selectedFile = null;
        
        // File selection handling
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);
        
        // Drag and drop handling
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                selectedFile = files[0];
                updateUI();
            }
        });
        
        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            updateUI();
        }
        
        function updateUI() {
            const uploadBtn = document.getElementById('uploadBtn');
            const result = document.getElementById('result');
            
            if (selectedFile) {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = `🚀 Process "${selectedFile.name}" with Gemini AI`;
                result.style.display = 'none';
            } else {
                uploadBtn.disabled = true;
                uploadBtn.innerHTML = '🚀 Process CV with Gemini AI';
            }
        }
        
        async function uploadFile() {
            if (!selectedFile) return;
            
            const uploadBtn = document.getElementById('uploadBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const result = document.getElementById('result');
            
            // Show progress
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '⏳ Processing...';
            progressContainer.style.display = 'block';
            result.style.display = 'none';
            
            // Animate progress
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 90) progress = 90;
                progressBar.style.width = progress + '%';
            }, 200);
            
            try {
                const formData = new FormData();
                formData.append('file', selectedFile);
                formData.append('jobId', 'test-job-' + Date.now());
                
                const response = await fetch('/api/upload-cv-direct', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Complete progress
                clearInterval(progressInterval);
                progressBar.style.width = '100%';
                
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    displayResult(data);
                    
                    // Reset UI
                    uploadBtn.disabled = false;
                    uploadBtn.innerHTML = '🚀 Process CV with Gemini AI';
                    selectedFile = null;
                    document.getElementById('fileInput').value = '';
                }, 500);
                
            } catch (error) {
                clearInterval(progressInterval);
                progressContainer.style.display = 'none';
                
                displayResult({
                    success: false,
                    error: error.message,
                    workflow: {
                        overallStatus: '❌ Network Error'
                    }
                });
                
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '🚀 Process CV with Gemini AI';
            }
        }
        
        function displayResult(data) {
            const result = document.getElementById('result');
            result.style.display = 'block';
            
            if (data.success) {
                result.className = 'result success';
                result.innerHTML = `
                    <h3>✅ CV Processing Successful!</h3>
                    
                    <div class="workflow-steps">
                        <div class="step completed">${data.workflow.step1_parsing} Step 1: CV Parsing with Gemini AI</div>
                        <div class="step completed">${data.workflow.step2_adding} Step 2: Adding candidate to job</div>
                        <div class="step completed">${data.workflow.step3_retrieval} Step 3: Retrieving candidates list</div>
                        <div class="step completed">${data.workflow.overallStatus}</div>
                    </div>
                    
                    ${data.parsing ? `
                    <div class="candidate-details">
                        <h3>📊 Extracted Candidate Data:</h3>
                        <p><strong>Name:</strong> ${data.parsing.candidate.name}</p>
                        <p><strong>Email:</strong> ${data.parsing.candidate.email || 'Not provided'}</p>
                        <p><strong>Phone:</strong> ${data.parsing.candidate.phone || 'Not provided'}</p>
                        <p><strong>Location:</strong> ${data.parsing.candidate.location || 'Not specified'}</p>
                        <p><strong>Skills:</strong> ${data.parsing.candidate.skills?.length || 0} technical skills extracted</p>
                        <p><strong>Experience:</strong> ${data.parsing.candidate.experience?.length || 0} work positions</p>
                        <p><strong>Match Score:</strong> ${data.parsing.extractedData?.matching?.overallScore || 'N/A'}%</p>
                        <p><strong>Extraction Method:</strong> ${data.parsing.extractionMethod}</p>
                    </div>
                    ` : ''}
                    
                    ${data.candidatesList ? `
                    <div class="file-info">
                        <strong>📋 Candidates in Job:</strong> ${data.candidatesList.total} total candidates
                        <br><strong>Job ID:</strong> ${data.jobId}
                    </div>
                    ` : ''}
                    
                    <div class="instructions">
                        <h3>🎉 Success! The CV parsing system is working perfectly:</h3>
                        <ul>
                            <li><strong>✅ Real Data Extraction:</strong> Gemini AI extracted actual names, emails, and skills</li>
                            <li><strong>✅ No More Generic Data:</strong> No more 75% fallback scores or "Professional Skills" placeholders</li>
                            <li><strong>✅ AI Analysis:</strong> Realistic match scores based on actual CV content</li>
                            <li><strong>✅ Database Integration:</strong> Candidates properly stored and retrievable</li>
                        </ul>
                        
                        <h3>🚀 Next Steps for Production:</h3>
                        <ul>
                            <li>The system is ready for recruiter use</li>
                            <li>Upload PDFs through the main application interface</li>
                            <li>Review AI-generated candidate analyses and match scores</li>
                            <li>Use the candidate management dashboard for hiring decisions</li>
                        </ul>
                    </div>
                `;
            } else {
                result.className = 'result error';
                result.innerHTML = `
                    <h3>❌ CV Processing Failed</h3>
                    <div class="file-info">
                        <strong>Error:</strong> ${data.error || 'Unknown error'}
                    </div>
                    
                    ${data.workflow ? `
                    <div class="workflow-steps">
                        <div class="step ${data.workflow.step1_parsing?.includes('✅') ? 'completed' : 'failed'}">${data.workflow.step1_parsing || '❓ Unknown'}</div>
                        <div class="step ${data.workflow.step2_adding?.includes('✅') ? 'completed' : 'failed'}">${data.workflow.step2_adding || '❓ Not reached'}</div>
                        <div class="step ${data.workflow.step3_retrieval?.includes('✅') ? 'completed' : 'failed'}">${data.workflow.step3_retrieval || '❓ Not reached'}</div>
                        <div class="step failed">${data.workflow.overallStatus || '❌ Failed'}</div>
                    </div>
                    ` : ''}
                    
                    <div class="instructions">
                        <h3>🔧 Troubleshooting:</h3>
                        <ul>
                            <li>Check that the file is a valid CV/resume</li>
                            <li>Ensure the file size is under 10MB</li>
                            <li>Try with a different file format (TXT, PDF, DOC)</li>
                            <li>Verify network connection and try again</li>
                        </ul>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
